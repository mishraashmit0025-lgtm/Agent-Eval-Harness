[project]
name = "agentbench"
version = "0.1.0"
description = "Evaluate coding agents on tasks with hidden verifiers: sandboxes, pass@k, task validation"
requires-python = ">=3.11"
dependencies = ["pytest>=8"]

[project.optional-dependencies]
cagent = ["coding-agent"]

[project.scripts]
abench = "agentbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentbench"]
